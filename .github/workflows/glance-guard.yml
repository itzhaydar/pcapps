name: Build Glance Guard
on:
  workflow_dispatch:
  push:
    paths:
      - 'glance-guard/**'
      - '.github/workflows/glance-guard.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: glance-guard
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: glance-guard/requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare bundled offline assets
        run: python tools/prepare_assets.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Actual model and Qt smoke check
        run: python -m tests.smoke_runtime
      - name: Package windowed Windows executable
        run: python -m PyInstaller --clean --noconfirm GlanceGuard.spec
      - name: Collect build versions and license metadata
        run: |
          python -m pip freeze | Out-File -Encoding utf8 dist/GlanceGuard/DEPENDENCIES.txt
          Copy-Item README.md,RESEARCH.md dist/GlanceGuard/
          New-Item -ItemType Directory -Force dist/GlanceGuard/licenses
          @'
          import importlib.metadata as md
          import pathlib, shutil
          target = pathlib.Path('dist/GlanceGuard/licenses')
          for dist in md.distributions():
              name = dist.metadata.get('Name', 'unknown')
              for item in dist.files or []:
                  if any(token in str(item).lower() for token in ('license', 'copying', 'notice')):
                      source = pathlib.Path(dist.locate_file(item))
                      if source.is_file():
                          destination = target / name / str(item).replace('..', '_')
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source, destination)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: GlanceGuard-Windows
          path: glance-guard/dist/GlanceGuard/
          if-no-files-found: error
          retention-days: 30
